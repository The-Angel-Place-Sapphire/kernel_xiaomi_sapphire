name: Build Sapphire Kernel (pure clang)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Branch kernel"
        default: "lineage-23.2"
      defconfig:
        description: "Defconfig"
        default: "vendor/sapphire_defconfig"
      merge_gki_fragment:
        description: "Gabungkan vendor/sapphire_GKI.config?"
        type: boolean
        default: false
      build_dtbs:
        description: "(Eksperimental) build DTB dari repo devicetrees"
        type: boolean
        default: false
      kernel_name:
        description: "Nama kernel"
        default: "AngelKernel"
      make_release:
        description: "Upload ke GitHub Releases?"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CLANG_REV: r450784e
  ORG: https://github.com/The-Angel-Place-Sapphire
  KERNEL_BRANCH: ${{ inputs.kernel_branch }}
  DEFCONFIG: ${{ inputs.defconfig }}
  KERNEL_NAME: ${{ inputs.kernel_name }}
  MERGE_GKI: ${{ inputs.merge_gki_fragment }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Bebaskan ruang disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install dependensi (tanpa GCC cross compiler)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make bc bison flex libssl-dev libelf-dev libc6-dev cpio \
            git curl zip unzip python3 lz4 xz-utils zstd ccache dwarves

      - name: Cache clang AOSP
        uses: actions/cache@v4
        with:
          path: ~/clang
          key: aosp-clang-${{ env.CLANG_REV }}

      - name: Siapkan clang AOSP r450784e (clang 14.0.7)
        run: |
          set -eo pipefail
          CLANG_DIR="$HOME/clang"

          if [ -x "$CLANG_DIR/bin/clang" ] && "$CLANG_DIR/bin/clang" --version >/dev/null 2>&1; then
            echo "clang dipakai dari cache"
            exit 0
          fi

          mkdir -p "$CLANG_DIR"
          ok=0
          for ref in android14-release master-kernel-build-2022; do
            url="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${ref}/clang-${CLANG_REV}.tar.gz"
            echo "Mengunduh: $url"
            if curl -fL --retry 3 --retry-delay 5 "$url" | tar -xz -C "$CLANG_DIR"; then
              ok=1
              break
            fi
            rm -rf "$CLANG_DIR"/*
          done

          if [ "$ok" != 1 ]; then
            echo "::warning::Unduhan AOSP clang gagal, memakai clang-14 dari apt (tetap clang + LLVM binutils)"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends clang-14 lld-14 llvm-14
            mkdir -p "$CLANG_DIR/bin"
            for t in clang clang++ ld.lld lld llvm-ar llvm-nm llvm-objcopy llvm-objdump \
                     llvm-readelf llvm-strip llvm-as llvm-ranlib; do
              ln -sf "$(command -v ${t}-14)" "$CLANG_DIR/bin/$t"
            done
          fi

      - name: Siapkan environment dan verifikasi toolchain
        run: |
          set -e
          mkdir -p "$HOME/ccache-bin"
          ln -sf "$(command -v ccache)" "$HOME/ccache-bin/clang"
          ln -sf "$(command -v ccache)" "$HOME/ccache-bin/clang++"

          cat > "$HOME/kenv.sh" <<'EOF'
          export PATH="$HOME/ccache-bin:$HOME/clang/bin:$PATH"
          export CCACHE_DIR="$HOME/.ccache"
          export CCACHE_COMPILERCHECK=content
          export CCACHE_MAXSIZE=5G
          export MAKE_ARGS="O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 KCFLAGS=-D__ANDROID_COMMON_KERNEL__"
          EOF

          source "$HOME/kenv.sh"
          for t in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
            command -v "$t" >/dev/null || { echo "::error::$t tidak ditemukan"; exit 1; }
          done
          clang --version | head -n 1
          ld.lld --version | head -n 1

      - name: Clone source kernel
        run: |
          git clone --depth=1 -b "$KERNEL_BRANCH" "$ORG/kernel_xiaomi_sapphire.git" kernel
          echo "COMMIT=$(git -C kernel rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Clone AnyKernel3
        run: git clone --depth=1 https://github.com/osm0sis/AnyKernel3 anykernel

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-sapphire-${{ github.run_id }}
          restore-keys: ccache-sapphire-

      - name: Konfigurasi kernel
        working-directory: kernel
        run: |
          set -e
          source "$HOME/kenv.sh"
          make $MAKE_ARGS "$DEFCONFIG"

          if [ "$MERGE_GKI" = "true" ]; then
            scripts/kconfig/merge_config.sh -m -O out out/.config \
              arch/arm64/configs/vendor/sapphire_GKI.config
            make $MAKE_ARGS olddefconfig
          fi

          # Pastikan kernel benar-benar dibangun dengan clang + lld
          grep -q '^CONFIG_CC_IS_CLANG=y' out/.config || { echo "::error::Compiler bukan clang"; exit 1; }
          grep -q '^CONFIG_LD_IS_LLD=y'   out/.config || { echo "::error::Linker bukan lld"; exit 1; }
          grep '^CONFIG_CC_VERSION_TEXT=' out/.config

      - name: Build Image kernel
        working-directory: kernel
        run: |
          set -eo pipefail
          source "$HOME/kenv.sh"
          ccache -z
          make $MAKE_ARGS -j"$(nproc --all)" Image 2>&1 | tee ../build.log
          ccache -s
          ls -lh out/arch/arm64/boot/
          test -f out/arch/arm64/boot/Image
          {
            echo "### Toolchain"
            grep '^CONFIG_CC_VERSION_TEXT=' out/.config
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build DTB (eksperimental)
        if: ${{ inputs.build_dtbs }}
        continue-on-error: true
        working-directory: kernel
        run: |
          set -eo pipefail
          source "$HOME/kenv.sh"
          git clone --depth=1 -b "$KERNEL_BRANCH" "$ORG/kernel_xiaomi_sapphire-devicetrees.git" ../devicetrees
          # Tata letak repo ini belum diverifikasi; sesuaikan jika build gagal
          rm -rf arch/arm64/boot/dts/vendor
          ln -s "$PWD/../devicetrees" arch/arm64/boot/dts/vendor
          make $MAKE_ARGS -j"$(nproc --all)" dtbs 2>&1 | tee -a ../build.log
          mkdir -p ../dtbs-out
          find out/arch/arm64/boot/dts -name '*.dtb*' -exec cp {} ../dtbs-out/ \;

      - name: Upload DTB (jika ada)
        if: ${{ inputs.build_dtbs }}
        uses: actions/upload-artifact@v4
        with:
          name: dtbs
          path: dtbs-out
          if-no-files-found: ignore

      - name: Setup AnyKernel3
        run: |
          set -e
          cd anykernel
          rm -rf .git .github README.md
          cp ../kernel/out/arch/arm64/boot/Image .

          # Ganti script contoh (init.tuna.rc, fstab.tuna, dst.) dengan setup minimal:
          # hanya mengganti kernel di partisi boot, ramdisk tidak disentuh.
          cat > anykernel.sh <<EOF
          ### AnyKernel3 - Redmi Note 13 4G (sapphire)
          properties() { '
          kernel.string=${KERNEL_NAME} (${COMMIT})
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=sapphire
          device.name2=sapphiren
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          EOF

      - name: Buat zip flashable
        run: |
          set -e
          cd anykernel
          SAFE_NAME="$(echo "$KERNEL_NAME" | tr -c 'A-Za-z0-9._-' '_')"
          ZIPNAME="${SAFE_NAME}-sapphire-$(date +%Y%m%d-%H%M)-${COMMIT}.zip"
          zip -r9 "../${ZIPNAME}" * -x '.git*' 'README.md' '*placeholder'
          echo "ZIPNAME=${ZIPNAME}" >> "$GITHUB_ENV"

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIPNAME }}
          path: ${{ env.ZIPNAME }}

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Rilis
        if: ${{ inputs.make_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sapphire-${{ github.run_number }}
          name: ${{ inputs.kernel_name }} sapphire #${{ github.run_number }}
          body: "Commit ${{ env.COMMIT }} - ${{ inputs.defconfig }}"
          files: ${{ env.ZIPNAME }}
