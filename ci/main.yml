name: Build Sapphire Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Branch kernel"
        default: "lineage-23.2"
      defconfig:
        description: "Defconfig"
        default: "vendor/sapphire_defconfig"
      merge_gki_fragment:
        description: "Gabungkan vendor/sapphire_GKI.config?"
        type: boolean
        default: false
      build_dtbs:
        description: "(Eksperimental) build DTB dari repo devicetrees"
        type: boolean
        default: false
      kernel_name:
        description: "Nama kernel"
        default: "AngelKernel"
      make_release:
        description: "Upload ke GitHub Releases?"
        type: boolean
        default: false

env:
  ARCH: arm64
  CLANG_VER: 18
  ORG: https://github.com/The-Angel-Place-Sapphire

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Bebaskan ruang disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install dependensi
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libncurses-dev build-essential \
            ccache cpio zip unzip git curl python3 lz4 xz-utils zstd \
            device-tree-compiler dwarves \
            clang-${CLANG_VER} lld-${CLANG_VER} llvm-${CLANG_VER} \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

          # Symlink agar LLVM=1 memakai clang versi terpilih
          mkdir -p $HOME/llvm-bin
          for t in clang clang++ ld.lld lld llvm-ar llvm-nm llvm-objcopy \
                   llvm-objdump llvm-readelf llvm-strip llvm-as llvm-ranlib; do
            ln -sf $(command -v ${t}-${CLANG_VER}) $HOME/llvm-bin/$t
          done
          echo "$HOME/llvm-bin" >> $GITHUB_PATH

      - name: Clone source kernel
        run: |
          git clone --depth=1 -b "${{ inputs.kernel_branch }}" \
            $ORG/kernel_xiaomi_sapphire.git kernel
          echo "COMMIT=$(git -C kernel rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Clone AnyKernel3
        run: git clone --depth=1 https://github.com/osm0sis/AnyKernel3 anykernel

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-sapphire-${{ github.run_id }}
          restore-keys: ccache-sapphire-

      - name: Konfigurasi kernel
        working-directory: kernel
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          MAKE_ARGS="O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          echo "MAKE_ARGS=$MAKE_ARGS" >> $GITHUB_ENV

          make $MAKE_ARGS "${{ inputs.defconfig }}"

          if [ "${{ inputs.merge_gki_fragment }}" = "true" ]; then
            scripts/kconfig/merge_config.sh -m -O out out/.config \
              arch/arm64/configs/vendor/sapphire_GKI.config
            make $MAKE_ARGS olddefconfig
          fi

      - name: Build Image kernel
        working-directory: kernel
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          export CCACHE_DIR=$HOME/.ccache
          ccache -M 5G
          make $MAKE_ARGS -j$(nproc --all) Image 2>&1 | tee ../build.log
          ls -lh out/arch/arm64/boot/
          test -f out/arch/arm64/boot/Image

      - name: (Eksperimental) Build DTB
        if: ${{ inputs.build_dtbs }}
        continue-on-error: true
        working-directory: kernel
        run: |
          git clone --depth=1 -b "${{ inputs.kernel_branch }}" \
            $ORG/kernel_xiaomi_sapphire-devicetrees.git ../devicetrees
          # Tata letak repo ini belum diverifikasi; sesuaikan jika build gagal
          ln -sfn "$PWD/../devicetrees" arch/arm64/boot/dts/vendor
          make $MAKE_ARGS -j$(nproc --all) dtbs 2>&1 | tee -a ../build.log
          find out/arch/arm64/boot/dts -name '*.dtb*' | head -n 20

      - name: Setup AnyKernel3
        run: |
          cd anykernel
          rm -rf .git .github README.md
          cp ../kernel/out/arch/arm64/boot/Image .

          # Sertakan DTB jika ada (hanya bila build_dtbs sukses)
          if find ../kernel/out/arch/arm64/boot/dts -name '*.dtb' 2>/dev/null | grep -q .; then
            cat $(find ../kernel/out/arch/arm64/boot/dts -name '*.dtb' | sort) > dtb
          fi

          sed -i "s|^kernel.string=.*|kernel.string=${{ inputs.kernel_name }} (${COMMIT}) for Redmi Note 13 4G|" anykernel.sh
          sed -i "s|^do.devicecheck=.*|do.devicecheck=1|" anykernel.sh
          sed -i "s|^device.name1=.*|device.name1=sapphire|" anykernel.sh
          sed -i "s|^device.name2=.*|device.name2=sapphiren|" anykernel.sh
          sed -i "s|^do.cleanup=.*|do.cleanup=1|" anykernel.sh
          sed -i "s|^BLOCK=.*|BLOCK=boot;|" anykernel.sh
          sed -i "s|^IS_SLOT_DEVICE=.*|IS_SLOT_DEVICE=auto;|" anykernel.sh

      - name: Buat zip flashable
        run: |
          cd anykernel
          ZIPNAME="${{ inputs.kernel_name }}-sapphire-$(date +%Y%m%d-%H%M)-${COMMIT}.zip"
          zip -r9 "../${ZIPNAME}" * -x '.git*' 'README.md' '*placeholder'
          echo "ZIPNAME=${ZIPNAME}" >> $GITHUB_ENV

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIPNAME }}
          path: ${{ env.ZIPNAME }}

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Rilis
        if: ${{ inputs.make_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sapphire-${{ github.run_number }}
          name: ${{ inputs.kernel_name }} sapphire #${{ github.run_number }}
          body: "Commit ${{ env.COMMIT }} · ${{ inputs.defconfig }}"
          files: ${{ env.ZIPNAME }}
          
